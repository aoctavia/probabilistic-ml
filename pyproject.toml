[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfm"
version = "0.1.0"
description = "Structured probabilistic factor models with scalable inference"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpyro>=0.15.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-jupyter>=0.24",
    "pymdown-extensions>=10.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sfm"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"experiments/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sfm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sfm --cov-report=term-missing -v"
